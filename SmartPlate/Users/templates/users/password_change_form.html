{% extends 'base.html' %}
{# Форма смены пароля авторизованного пользователя. #}
{% block title %}Смена пароля{% endblock %}
{% block content %}
<div class="page-heading compact-card"><span class="eyebrow">Безопасность</span><h1>Смена пароля</h1><p>Введите текущий пароль, затем дважды укажите новый.</p></div>
<form class="panel compact-card" method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">Изменить пароль</button></form>
{% endblock %}
