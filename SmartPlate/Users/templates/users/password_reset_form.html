{% extends 'base.html' %}

{% block title %}Восстановление пароля{% endblock %}

{% block content %}
<h1>Восстановление пароля</h1>

<p>Введите e-mail, указанный при регистрации. На него будет отправлена ссылка для восстановления пароля.</p>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <p><button type="submit">Отправить письмо</button></p>
</form>

<p><a href="{% url 'Users:login' %}">Вернуться к авторизации</a></p>
{% endblock %}
