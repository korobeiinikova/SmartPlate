{# Частичный шаблон облака тегов с количеством рецептов. #}
{% if tags %}
    <div class="tags-cloud">
        {% for t in tags %}
            <a href="{{ t.get_absolute_url }}" class="tag-link">
                {{ t.name }} ({{ t.total }})
            </a>
        {% endfor %}
    </div>
{% else %}
    <p>Тегов пока нет</p>
{% endif %}
